<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSSSB Cyber Forensic Theory Study Guide — 3D Digital Textbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-parchment">
  <!-- Top App Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <button id="tocToggleBtn" class="btn-icon" title="Table of Contents (Alt+T)" aria-label="Table of Contents">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <span>Chapters</span>
      </button>
      <div class="book-meta">
        <span class="badge-exam">DSSSB JSA (Cyber Forensic)</span>
        <span class="book-title-short">Cyber Crimes, Offences & Penalties</span>
      </div>
    </div>

    <!-- Search input -->
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Search sections, penalties, topics (e.g. 66F, BNS 78, PKI)..." autocomplete="off">
      <button id="clearSearchBtn" class="btn-clear hidden" title="Clear search">&times;</button>
      <div id="searchResultsDropdown" class="search-dropdown hidden"></div>
    </div>

    <!-- Action Tools -->
    <div class="header-right">
      <button id="audioNarrationBtn" class="btn-tool btn-audio" title="Read Aloud (Text-to-Speech)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        <span id="audioStatusText">Listen</span>
      </button>
      <button id="viewModeToggleBtn" class="btn-tool" title="Toggle 1-Page / 2-Page View">1-Page</button>
      <div class="font-controls">
        <button id="fontSizeDecBtn" class="btn-tool" title="Decrease font size">A-</button>
        <button id="fontSizeIncBtn" class="btn-tool" title="Increase font size">A+</button>
      </div>
      <div class="theme-controls">
        <button id="themeToggleBtn" class="btn-tool" title="Change Theme (Paper / Dark / Classic)">Theme</button>
      </div>
      <button id="fullscreenBtn" class="btn-icon" title="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
      </button>
    </div>
  </header>

  <!-- Main Digital Reading Stage -->
  <main class="reading-stage">
    <!-- 3D Upright Book -->
    <div class="book-wrapper">
      <div class="book-hardcover-shadow"></div>
      
      <div class="book upright" id="textbook">
        <!-- Spine crease and book shadow -->
        <div class="gap"></div>

        <!-- Left Page Stack -->
        <div class="page-stack left-stack">
          <div class="page page-active left-page" id="leftPage">
            <!-- Left page rendered dynamically -->
          </div>
        </div>

        <!-- Right Page Stack -->
        <div class="page-stack right-stack">
          <div class="page page-active right-page" id="rightPage">
            <!-- Right page rendered dynamically -->
          </div>
        </div>

        <!-- Realistic 3D Content-Bearing Turning Leaf -->
        <div class="turning-leaf" id="turningLeaf">
          <div class="leaf-front" id="leafFront"></div>
          <div class="leaf-back" id="leafBack"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Reading Controller Bar -->
  <footer class="reading-controls">
    <div class="controls-container">
      <button id="firstPageBtn" class="btn-nav" title="First Page (Home)">⇤ First</button>
      <button id="prevBtn" class="btn-nav btn-primary" title="Previous Page (Left Arrow)">← Prev</button>

      <div class="page-scrubber">
        <input type="range" id="pageRange" min="0" max="19" value="0" step="1">
        <span id="pageIndicator" class="page-indicator">Spread 1 of 20 (Pages 1–2)</span>
      </div>

      <button id="nextBtn" class="btn-nav btn-primary" title="Next Page (Right Arrow)">Next →</button>
      <button id="lastPageBtn" class="btn-nav" title="Last Page (End)">Last ⇥</button>
      <button id="bottomAudioBtn" class="btn-nav" title="Read Aloud Page">Audio 🔊</button>
      <button id="autoFlipBtn" class="btn-nav" title="Toggle Auto Page Turn">Auto-Turn: OFF</button>
    </div>
    <div class="keyboard-hints">
      <span>Keys: <b>←</b> Prev Page | <b>→</b> Next Page | <b>Space</b> Auto-Turn | <b>Esc</b> Close Menu</span>
    </div>
  </footer>

  <!-- Slide-out Table of Contents Drawer -->
  <aside id="tocDrawer" class="toc-drawer hidden">
    <div class="toc-header">
      <h3>Syllabus Roadmap</h3>
      <button id="closeTocBtn" class="btn-close" aria-label="Close">&times;</button>
    </div>
    <div class="toc-subtitle">DSSSB JSA (Cyber Forensic) 10-Chapter Theory Guide</div>
    <ul class="toc-list" id="tocList">
      <!-- Generated dynamically in script.js -->
    </ul>
  </aside>
  <div id="drawerOverlay" class="drawer-overlay hidden"></div>

  <!-- Book Script -->
  <script src="script.js"></script>
</body>
</html>
